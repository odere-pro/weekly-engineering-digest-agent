# pnpm settings. This repo is a single package, not a workspace; pnpm 10 reads its settings here.

# Refuse a version published less than 14 days ago (20160 minutes) when a new version is resolved:
# a malicious release is usually found and pulled within days. Dependabot-style bumps wait too.
# A package that must be taken sooner is listed in `minimumReleaseAgeExclude` by the maintainer.
minimumReleaseAge: 20160
