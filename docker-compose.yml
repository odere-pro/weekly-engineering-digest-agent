# Weekly engineering digest. Needs Docker Compose 2.24 or newer. Two modes for Ollama:
#
#   Mac (default): Docker on macOS cannot use the Apple GPU, so the app talks to the Ollama app on
#     the host. `digest init` writes OLLAMA_URL=http://host.docker.internal:11434 to .env when it
#     knows the host is a Mac. The container is Linux, so the app must be told the host is a Mac to
#     pick the Mac model profiles: `make docker-*` exports DIGEST_HOST_OS and DIGEST_HOST_ARCH from
#     uname; with plain `docker compose`, export darwin and arm64 yourself (passed through below).
#   Linux: `docker compose --profile linux up -d` adds a bundled Ollama and pulls the models once
#     into the `ollama-models` volume (or set COMPOSE_PROFILES=linux). OLLAMA_URL then defaults to
#     http://ollama:11434. A value in .env wins, and localhost never works from inside a container.
#
# Tracing: `docker compose --profile tracing up -d` adds Jaeger (UI on http://localhost:16686).
#   Also set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces in .env or the shell: Compose
#   cannot turn the variable on by profile, and the app traces only when it is set.
#
# Files: digest.config.json and .env are mounted from this folder, so they must exist before the
#   first run (`touch digest.config.json .env`). The app reads secrets from the mounted .env; there
#   is no env_file, so secrets stay out of `docker inspect` and `docker compose config`.
#   Init needs no Ollama: run it as `docker compose run --rm --no-deps digest init` (or
#   `make docker-init`). Empty files count as absent, so `init --yes` works on the touched files.
# Linux hosts: create ./data yourself and set DIGEST_UID/DIGEST_GID (in .env or the shell) to your
#   `id -u`/`id -g`, so the container can write ./data and read a chmod 600 .env.
# Time zone: `digest init` writes schedule.timeZone to digest.config.json; that is what the weekly
#   schedule and the ISO week use. Its prompt defaults to the container's zone, which is UTC unless
#   TZ (for example Europe/Berlin) is set in .env or the shell.
# Stopping: `serve` finishes a digest that is running before it exits, so `stop_grace_period` is
#   long. A container that is killed anyway leaves a run lock; the next run takes it over once its
#   heartbeat is 5 minutes old, including from another container.

name: eng-digest

services:
  digest:
    build: .
    image: eng-digest:local
    init: true
    restart: unless-stopped
    # Longer than a digest takes. The quality profile ran for about 59 minutes (3554 s, 131 items)
    # on the reference laptop (W2-05), and a single write call may wait up to 10 minutes, so this
    # leaves about half again for a slower machine or a busier week. Idle containers stop at once;
    # this only delays `docker compose stop` while a run is in flight. A run that outlasts it is
    # killed. The next start catches up on the week: the lock it left is taken over within 5
    # minutes (see the top), and the scheduler retries a refused run every 5 minutes for 2 hours.
    stop_grace_period: 90m
    user: '${DIGEST_UID:-1000}:${DIGEST_GID:-1000}'
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - TZ=${TZ:-UTC}
      # No value: passed through from the shell or .env only when set.
      - DIGEST_HOST_OS
      - DIGEST_HOST_ARCH
      - OTEL_EXPORTER_OTLP_ENDPOINT
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./digest.config.json
        target: /app/digest.config.json
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /app/.env
        bind:
          create_host_path: false
    extra_hosts:
      - host.docker.internal:host-gateway
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      ollama:
        condition: service_healthy
        required: false
      model-pull:
        condition: service_completed_successfully
        required: false

  ollama:
    profiles: [linux]
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    restart: unless-stopped
    environment:
      # One model in memory at a time: the steps run in sequence and the models are large.
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ollama-models:/root/.ollama
    # NVIDIA GPU (needs the NVIDIA Container Toolkit); without it the models run on the CPU.
    # gpus: all
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 10s
      retries: 30

  model-pull:
    profiles: [linux]
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    restart: 'no'
    entrypoint: ['/bin/sh', '/docker/pull-models.sh']
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Set REFRESH_MODELS=1 to pull models that are already present.
      REFRESH_MODELS: ${REFRESH_MODELS:-}
    volumes:
      - ./docker/pull-models.sh:/docker/pull-models.sh:ro
      - type: bind
        source: ./digest.config.json
        target: /app/digest.config.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      ollama:
        condition: service_healthy

  jaeger:
    profiles: [tracing]
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    restart: unless-stopped
    ports:
      - '127.0.0.1:16686:16686'

volumes:
  ollama-models:
