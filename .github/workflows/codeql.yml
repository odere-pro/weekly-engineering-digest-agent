name: codeql

# Advanced setup (code scanning's default setup is not enabled on this repo). It cannot run
# locally: `pnpm lint:actions` (zizmor) and a YAML parse are the checks before pushing.
# Bug classes it targets: polynomial ReDoS, incomplete URL sanitisation, request forgery and
# clear-text logging of secrets, in the TypeScript and in the workflows themselves.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:17 UTC: new queries land without a push.
    - cron: '17 4 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
      security-events: write # upload the results to code scanning
      actions: read # the actions analysis reads workflow runs
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      # Pinned to commit SHAs with the release tag in the comment; to bump, follow the note in
      # ci.yml. codeql-action: the newest v4 release at least 14 days old.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
