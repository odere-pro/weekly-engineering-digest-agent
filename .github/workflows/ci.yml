name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      # Runs every test and fails under 80% lines, functions, branches or statements
      # (thresholds in vitest.config.ts).
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Builds the image the way docker/validate.sh does, then scans it. No third-party action:
      # Trivy runs from its own pinned image, with the Docker socket mounted to read the local image.
      # To bump: pick a release at least two weeks old on Docker Hub (aquasec/trivy) and copy the
      # tag's manifest digest next to it.
      # --ignore-unfixed: fail only on what a rebuild can fix. A CVE Debian has no fix for yet
      # would keep main red with nothing to do; it fails the scan once its fix ships.
      - run: docker build --tag eng-digest:scan .
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed eng-digest:scan
