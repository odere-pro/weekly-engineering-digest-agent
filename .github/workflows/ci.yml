name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces its running checks; main always runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The second leg also runs the whole suite in a time zone far from UTC (UTC+14, a date
        # ahead of most of the world): five tests once passed only because the runner's zone was UTC.
        include:
          - node: 24
            tz: UTC
          - node: 26
            tz: Pacific/Kiritimati
    env:
      TZ: ${{ matrix.tz }}
    steps:
      # Every action is pinned to a commit SHA, with its release tag in the comment: a tag can be
      # moved, a SHA cannot. To bump, resolve the new tag's commit with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (an annotated tag needs one more step:
      # `gh api repos/<owner>/<repo>/git/tags/<sha>`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      # Unused dependencies, files and exports (knip.json) and copy-paste growth (.jscpd.json).
      - run: pnpm knip
      - run: pnpm dupes
      - run: pnpm docs:mermaid
      # Runs every test and fails when any file is under 80% lines, functions, branches or
      # statements (thresholds in vitest.config.ts).
      - run: pnpm coverage
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  # Audits the workflows themselves (unpinned actions, persisted credentials, excessive
  # permissions, template injection). Online, so it also checks that every pinned SHA belongs to its
  # repository and that no action is a known-vulnerable version. Offline locally: `pnpm lint:actions`.
  # pipx is on GitHub's ubuntu runners. To bump, pick a zizmor release at least two weeks old.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.30.1 .github
        env:
          GH_TOKEN: ${{ github.token }}

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the image the way docker/validate.sh does, then scans it. No third-party action in
      # this job (the check job has pnpm/action-setup, pinned by SHA): Trivy runs from its own
      # pinned image, with the Docker socket mounted to read the local image.
      # To bump: pick a release at least two weeks old on Docker Hub (aquasec/trivy) and copy the
      # tag's manifest digest next to it.
      # --ignore-unfixed: fail only on what a rebuild can fix. A CVE Debian has no fix for yet
      # would keep main red with nothing to do; it fails the scan once its fix ships.
      - run: docker build --tag eng-digest:scan .
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed eng-digest:scan
